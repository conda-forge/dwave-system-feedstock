{% set name = "dwave-system" %}
{% set version = "1.36.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: e1b978b1fcac316e1b5b30ef4e5da337dd01a2347527d17e075ee09d3a76b9aa

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - dwave-graphs >=1,<2
    - dwave-optimization >=0.1.0,<0.9
    - networkx >=3.2,<4
    - dwave-samplers >=1.0.0
    - scipy >=1.13
    - dimod >=0.12.20,<0.14.0
    - dwave-cloud-client >=0.12.0,<0.15.0
    - dwave-networkx >=0.8.10
    - dwave-preprocessing >=0.5.0
    - homebase >=1.0.0,<2.0.0
    - minorminer >=0.2.19,<0.3.0
    - numpy >=2,<3
    - python >={{ python_min }}
  run_constrained:
    - dwave-drivers >=0.4.0,<0.5.0

test:
  imports:
    - dwave
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/dwavesystems/dwave-system
  summary: All things D-Wave System.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - BastianZim
